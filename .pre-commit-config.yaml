repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: python -m ruff check
        language: system
        types: [python]
        files: ^(dashboard(\.py|_data\.py|_analytics\.py|_metrics\.py)|database_queries\.py|setup\.py|supabase_client\.py|tests/.*\.py)$
      - id: ruff-format
        name: ruff format
        entry: python -m ruff format
        language: system
        types: [python]
        files: ^(dashboard(\.py|_data\.py|_analytics\.py|_metrics\.py)|database_queries\.py|setup\.py|supabase_client\.py|tests/.*\.py)$
